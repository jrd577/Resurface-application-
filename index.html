<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Resurface</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Revise what you have gone longest without opening.">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow paper column; subjects list, then chapters as ruled ledgers. */
:root{--ink:#1B2B27;--soft:#55645F;--paper:#EEF1E7;--bg-a:#F6F4EA;--bg-b:#E8EEE4;--raised:#FBFAF4;--stamp:#1F7A6D;--stamp-d:#165F54;--on-stamp:#FFFFFF;--stamp-soft:rgba(31,122,109,.09);--stamp-ring:rgba(31,122,109,.2);--rust:#B0452F;--rust-soft:rgba(176,69,47,.09);--line:rgba(27,43,39,.16);--line-s:rgba(27,43,39,.09);--edge:rgba(27,43,39,.3);--hover:rgba(27,43,39,.04);--shadow:rgba(27,43,39,.35);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#E8EFEA;--soft:#9AABA5;--paper:#101715;--bg-a:#131C19;--bg-b:#0E1412;--raised:#1A2522;--stamp:#3FB5A3;--stamp-d:#5CCBBA;--on-stamp:#0B1513;--stamp-soft:rgba(63,181,163,.14);--stamp-ring:rgba(63,181,163,.3);--rust:#E58A74;--rust-soft:rgba(229,138,116,.14);--line:rgba(232,239,234,.2);--line-s:rgba(232,239,234,.1);--edge:rgba(232,239,234,.3);--hover:rgba(232,239,234,.06);--shadow:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E8EFEA;--soft:#9AABA5;--paper:#101715;--bg-a:#131C19;--bg-b:#0E1412;--raised:#1A2522;--stamp:#3FB5A3;--stamp-d:#5CCBBA;--on-stamp:#0B1513;--stamp-soft:rgba(63,181,163,.14);--stamp-ring:rgba(63,181,163,.3);--rust:#E58A74;--rust-soft:rgba(229,138,116,.14);--line:rgba(232,239,234,.2);--line-s:rgba(232,239,234,.1);--edge:rgba(232,239,234,.3);--hover:rgba(232,239,234,.06);--shadow:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(180deg,var(--bg-a) 0,var(--bg-b) 100%);background-attachment:fixed;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
.wrap{max-width:640px;margin:0 auto;padding-block:40px 80px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:36px;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:28px;margin:0;text-wrap:balance}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:9px;flex-shrink:0;display:block;box-shadow:0 2px 6px -2px var(--shadow)}
.logo-sm{width:32px;height:32px;border-radius:8px}
.tag{font-size:13px;color:var(--soft);margin-top:2px}
.toprow{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.toprow .goback{margin-bottom:0}
.meta{font-size:13px;color:var(--soft);text-align:right;flex-shrink:0}
.hright{display:flex;align-items:center;gap:12px;flex-shrink:0}
.theme-btn{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--ink);flex-shrink:0}
.theme-btn:hover{border-color:var(--ink);background:var(--hover)}
.theme-btn svg{width:18px;height:18px;display:block}
.toprow .theme-btn{margin-left:auto}
.card{position:relative;background:var(--raised);border:1px solid var(--edge);border-left:4px solid var(--stamp);border-radius:12px;padding:26px 26px 22px;box-shadow:0 1px 2px var(--hover),0 10px 24px -14px var(--shadow)}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:10px}
.eyebrow{font-size:12px;color:var(--soft)}
.stampno{font-family:'Source Serif 4',Georgia,serif;font-size:13px;color:var(--stamp-d);border:1px solid var(--stamp);padding:2px 10px;border-radius:999px;background:var(--stamp-soft);flex-shrink:0}
.card h2{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:26px;margin:0 0 10px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.waiting{font-size:14px;color:var(--rust);margin-bottom:20px}
.waiting.fresh{color:var(--soft)}
button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:8px;padding:10px 16px;transition:background-color .15s,border-color .15s,box-shadow .15s,transform .1s,color .15s}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.btn-primary{background:var(--stamp);border:1px solid var(--stamp);color:var(--on-stamp);font-weight:500;box-shadow:0 1px 2px var(--shadow)}
.btn-primary:hover{background:var(--stamp-d);border-color:var(--stamp-d)}
.btn-secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-secondary:hover{border-color:var(--ink);background:var(--hover)}
.sm{padding:5px 10px;font-size:13px}
.label{font-size:13px;color:var(--soft);margin:0 0 6px}
.ledger{border-top:1px solid var(--line);margin-bottom:44px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line-s);border-radius:6px}
.tt{min-width:0}
.title{font-size:15px}
.path{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.del{width:28px;height:28px;padding:0;display:grid;place-items:center;line-height:1;background:var(--rust-soft);border:1px solid color-mix(in srgb,var(--rust) 30%,transparent);color:var(--rust);font-size:16px;border-radius:8px}
.del:hover{border-color:var(--rust);background:color-mix(in srgb,var(--rust) 20%,transparent)}
.del-text{width:auto;height:auto;padding:5px 12px;font-size:13px;font-weight:500;margin-top:8px}
.empty{padding:26px 0;text-align:center;color:var(--soft);font-size:15px;border:1px dashed var(--line);border-radius:12px;margin-top:14px}
input[type=text]{flex:1;min-width:0;font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--soft);opacity:.8}
input:focus{outline:none;border-color:var(--stamp);box-shadow:0 0 0 3px var(--stamp-ring)}
form{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
form.big{margin-bottom:16px}
.srow{display:flex;align-items:center;gap:8px;padding:0 10px;margin:0 -10px;border-bottom:1px solid var(--line-s);border-radius:8px;transition:background-color .15s}
.srow:hover{background:var(--hover)}
.slink{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;color:inherit;text-decoration:none}
.srow:hover .arrow{color:var(--stamp)}
.sname{font-family:'Source Serif 4',Georgia,serif;font-size:20px;font-weight:600;margin-bottom:2px;overflow-wrap:anywhere}
.arrow{color:var(--soft);font-size:18px}
.goback{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--stamp-d);text-decoration:none;padding:6px 12px;border:1px solid color-mix(in srgb,var(--stamp) 35%,transparent);border-radius:8px;background:var(--stamp-soft);margin-bottom:22px;transition:background-color .15s,border-color .15s,transform .1s}
.goback:hover{border-color:var(--stamp);background:color-mix(in srgb,var(--stamp) 18%,transparent)}
.goback:active{transform:scale(.97)}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:26px;border-bottom:1px solid var(--line);padding-bottom:18px}
.shead h1{font-size:36px;min-width:0;overflow-wrap:anywhere}
.chapter{background:var(--raised);border:1px solid var(--edge);border-radius:12px;padding:18px 18px 6px;margin-bottom:26px;box-shadow:0 1px 2px var(--hover),0 10px 24px -14px var(--shadow)}
.chead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.chead h2{font-family:'Source Serif 4',Georgia,serif;font-size:22px;font-weight:600;margin:0;flex:1;min-width:0;line-height:1.25;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--soft);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chapter .ledger{margin-bottom:0}
.small{font-size:12px;color:var(--soft);margin-top:2px}
.topic{border-bottom:1px solid var(--line-s)}
.topic>.row{border-bottom:none}
.topic>.row:hover,.subs .row:hover{background:var(--hover)}
.subs{margin:0 0 6px 10px;border-left:2px solid var(--line)}
.subs .row{padding:8px 0 8px 12px;border-bottom:1px solid var(--line-s)}
.subs .row:last-child{border-bottom:none}
.subs .title{font-size:14px}
form.subf{margin:2px 0 12px 10px;padding-left:12px}
form.subf input{font-size:14px;padding:7px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.dlg{background:var(--raised);border:1px solid var(--edge);border-radius:12px;padding:24px;max-width:360px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 24px -14px var(--shadow)}
.dlg h3{font-family:'Source Serif 4',Georgia,serif;font-size:22px;margin:0 0 8px}
.dlg p{font-size:14px;color:var(--soft);line-height:1.5;margin:0 0 20px;overflow-wrap:anywhere}
.dlg .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn-danger{background:var(--rust);border:1px solid var(--rust);color:var(--on-stamp);font-weight:500}
@media(max-width:480px){.card h2{font-size:22px}h1{font-size:24px}.shead h1{font-size:30px}.card{padding:22px 20px 20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="wrap" id="app"></div>
<div class="ov" id="ov"></div>
<script>
const K='resurface-v2';
let D=load();
function load(){try{const r=JSON.parse(localStorage.getItem(K));if(!(r&&Array.isArray(r.subjects)))return{subjects:[],t:0};r.subjects.forEach(s=>s.chapters.forEach(c=>c.topics.forEach(t=>{if(!Array.isArray(t.subs))t.subs=[]})));return{subjects:r.subjects,t:r.t||0}}catch(e){return{subjects:[],t:0}}}
function store(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function save(){D.t=Date.now();store()}
const now=()=>Date.now();
const uid=()=>'i'+now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const days=ts=>Math.floor((now()-ts)/864e5);
const ago=ts=>{const m=Math.floor((now()-ts)/6e4);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';const d=Math.floor(h/24);return d===1?'1 day ago':d+' days ago'};
const logo=cls=>`<svg class="logo ${cls}" viewBox="0 0 64 64" role="img" aria-label="Resurface"><rect width="64" height="64" rx="14" fill="var(--stamp)"/><g fill="none" stroke="var(--on-stamp)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M42 24a15 15 0 1 0 4 11"/><path d="M44 12v12H32"/></g><circle cx="32" cy="34" r="3.5" fill="var(--on-stamp)"/></svg>`;

const TK='resurface-theme';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
try{const s=localStorage.getItem(TK);if(s==='dark'||s==='light')document.documentElement.dataset.theme=s}catch(e){}
const effTheme=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const themeLabel=()=>effTheme()==='dark'?'Switch to light theme':'Switch to dark theme';
const themeBtn=()=>`<button class="theme-btn" data-act="theme" title="${themeLabel()}" aria-label="${themeLabel()}">${effTheme()==='dark'?SUN:MOON}</button>`;
function toggleTheme(){
  const next=effTheme()==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem(TK,next)}catch(e){}
  document.querySelectorAll('.theme-btn').forEach(b=>{b.innerHTML=next==='dark'?SUN:MOON;b.title=b.ariaLabel=themeLabel();b.setAttribute('aria-label',themeLabel())});
}

// Chapters, topics and subtopics resurface. Oldest "last opened" comes first; just-opened sinks to the bottom.
function items(){
  const a=[];
  D.subjects.forEach(s=>s.chapters.forEach(c=>{
    a.push({kind:'Chapter',id:c.id,title:c.name,path:s.name,at:c.at,opens:c.opens,notes:''});
    c.topics.forEach(t=>{
      a.push({kind:'Topic',id:t.id,title:t.title,path:s.name+' › '+c.name,at:t.at,opens:t.opens,notes:t.notes});
      t.subs.forEach(u=>a.push({kind:'Subtopic',id:u.id,title:u.title,path:s.name+' › '+c.name+' › '+t.title,at:u.at,opens:u.opens,notes:u.notes}));
    });
  }));
  return a.sort((x,y)=>x.at-y.at);
}
function openItem(id){
  D.subjects.forEach(s=>s.chapters.forEach(c=>{
    if(c.id===id){c.at=now();c.opens++}
    c.topics.forEach(t=>{
      if(t.id===id){t.at=now();t.opens++;c.at=now()}
      t.subs.forEach(u=>{if(u.id===id){u.at=now();u.opens++;t.at=now();c.at=now()}});
    });
  }));
  save();render();
}
function remove(id){
  D.subjects=D.subjects.filter(s=>s.id!==id);
  D.subjects.forEach(s=>{s.chapters=s.chapters.filter(c=>c.id!==id);s.chapters.forEach(c=>{c.topics=c.topics.filter(t=>t.id!==id);c.topics.forEach(t=>{t.subs=t.subs.filter(u=>u.id!==id)})})});
  save();render();
}

const app=document.getElementById('app');
const route=()=>{const m=location.hash.match(/^#\/s\/(.+)$/);return m?m[1]:null};
const dl=id=>`<button class="del" data-act="del" data-id="${id}" title="Remove" aria-label="Remove">&times;</button>`;
const cnt=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const got=id=>`<button class="btn-secondary sm" data-act="open" data-id="${id}">Got it</button>`;

function home(){
  const it=items(), due=it.filter(x=>days(x.at)>=1).length;
  let h=`<header><div class="brand">${logo('')}<div><h1>Resurface</h1><div class="tag">Revisit what you're about to forget</div></div></div><div class="hright"><div class="meta">${due} due &middot; ${cnt(it.length,'item')}</div>${themeBtn()}</div></header>`;
  h+=`<div class="label">Subjects</div>
  <form class="big" data-f="subject"><input type="text" id="new-subject" placeholder="Add a subject (e.g. Biology)" autocomplete="off" required><button class="btn-primary">Add</button></form>
  <div class="ledger" style="margin-bottom:0">${D.subjects.map(s=>`<div class="srow"><a class="slink" href="#/s/${s.id}"><div style="min-width:0"><div class="sname">${esc(s.name)}</div><div class="path">${cnt(s.chapters.length,'chapter')} &middot; ${cnt(s.chapters.reduce((n,c)=>n+c.topics.length,0),'topic')}</div></div><span class="arrow">&rarr;</span></a>${dl(s.id)}</div>`).join('')}</div>${D.subjects.length?'':'<div class="empty">No subjects yet. Add one above.</div>'}`;
  return h;
}

function rowHTML(t){
  return `<div class="row"><div class="tt"><div class="title" style="overflow-wrap:anywhere">${esc(t.title)}</div>${t.notes?`<div class="small">${esc(t.notes)}</div>`:''}<div class="small">${ago(t.at)} &middot; opened ${cnt(t.opens,'time')}</div></div><div class="right">${got(t.id)}${dl(t.id)}</div></div>`;
}
function topicHTML(t){
  return `<div class="topic">${rowHTML(t)}${t.subs.length?`<div class="subs">${[...t.subs].sort((x,y)=>x.at-y.at).map(rowHTML).join('')}</div>`:''}<form class="subf" data-f="sub" data-id="${t.id}"><input type="text" placeholder="Add a subtopic" autocomplete="off" required><input type="text" placeholder="Notes (optional)" autocomplete="off"><button class="btn-secondary sm">Add</button></form></div>`;
}
function page(s){
  const nx=[...s.chapters].sort((a,b)=>a.at-b.at)[0];
  const nxCard=nx?`<div class="card" style="margin-bottom:26px"><div class="top"><span class="eyebrow">Up next chapter</span><span class="stampno">Ch. ${s.chapters.indexOf(nx)+1}</span></div><h2>${esc(nx.name)}</h2><div class="waiting ${days(nx.at)<1?'fresh':''}">${ago(nx.at)} &middot; opened ${cnt(nx.opens,'time')}</div><button class="btn-primary" data-act="open" data-id="${nx.id}">Got it</button></div>`:'';
  const tp=s.chapters.reduce((n,c)=>n+c.topics.length,0), sp=s.chapters.reduce((n,c)=>n+c.topics.reduce((m,t)=>m+t.subs.length,0),0);
  return `<div class="toprow"><a href="#/" aria-label="Home">${logo('logo-sm')}</a><a class="goback" href="#/">All subjects</a>${themeBtn()}</div>
  <div class="shead"><h1>${esc(s.name)}</h1><div class="meta">${cnt(s.chapters.length,'chapter')} &middot; ${cnt(tp,'topic')} &middot; ${cnt(sp,'subtopic')}<br><button class="del del-text" data-act="del" data-id="${s.id}">Delete subject</button></div></div>
  ${nxCard}
  <form class="big" data-f="chapter" data-id="${s.id}"><input type="text" id="new-chapter" placeholder="Add a chapter" autocomplete="off" required><button class="btn-primary">Add</button></form>
  ${s.chapters.length?'':'<div class="empty">No chapters yet.</div>'}
  ${s.chapters.map((c,i)=>`<section class="chapter"><div class="chead"><span class="stampno">Ch. ${i+1}</span><h2>${esc(c.name)}</h2>${dl(c.id)}</div>
    <div class="sub"><span>${ago(c.at)} &middot; opened ${cnt(c.opens,'time')}</span>${got(c.id)}</div>
    <div class="ledger">${[...c.topics].sort((x,y)=>x.at-y.at).map(topicHTML).join('')}</div>
    <form data-f="topic" data-id="${c.id}"><input type="text" placeholder="Add a topic" autocomplete="off" required><input type="text" placeholder="Notes (optional)" autocomplete="off"><button class="btn-secondary">Add</button></form></section>`).join('')}`;
}

function render(){
  D.subjects.forEach(s=>s.chapters.forEach(c=>c.topics.forEach(t=>{if(!Array.isArray(t.subs))t.subs=[]})));
  const id=route(), s=id&&D.subjects.find(x=>x.id===id);
  if(id&&!s){location.hash='#/';return}
  app.innerHTML=s?page(s):home();
}

const ov=document.getElementById('ov');let pending=null;
function find(id){
  for(const s of D.subjects){
    if(s.id===id)return{k:'subject',n:s.name,x:`This also deletes its ${cnt(s.chapters.length,'chapter')} and everything inside them.`};
    for(const c of s.chapters){
      if(c.id===id)return{k:'chapter',n:c.name,x:`This also deletes its ${cnt(c.topics.length,'topic')} and their subtopics.`};
      for(const t of c.topics){
        if(t.id===id)return{k:'topic',n:t.title,x:t.subs.length?`This also deletes its ${cnt(t.subs.length,'subtopic')}.`:''};
        for(const u of t.subs)if(u.id===id)return{k:'subtopic',n:u.title,x:''};
      }
    }
  }
}
function ask(id){
  const f=find(id); if(!f)return;
  pending=id;
  ov.innerHTML=`<div class="dlg"><h3>Do you want to delete this ${f.k}?</h3><p><b>${esc(f.n)}</b><br>${f.x} This can't be undone.</p><div class="actions"><button class="btn-secondary" data-act="cancel">Cancel</button><button class="btn-danger" data-act="confirm">Delete</button></div></div>`;
  ov.style.display='flex';
}
function closeAsk(){ov.style.display='none';ov.innerHTML='';pending=null}
ov.addEventListener('click',e=>{if(e.target===ov)closeAsk()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAsk()});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  e.preventDefault();
  if(b.dataset.act==='theme')return toggleTheme();
  if(b.dataset.act==='open')return openItem(b.dataset.id);
  const a=b.dataset.act;
  if(a==='cancel')return closeAsk();
  if(a==='confirm'){const i=pending;closeAsk();return remove(i)}
  ask(b.dataset.id);
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target, ins=f.querySelectorAll('input'), v=ins[0].value.trim(); if(!v)return;
  const id=f.dataset.id, type=f.dataset.f, t=now(), t0=()=>t;
  if(type==='subject') D.subjects.push({id:uid(),name:v,chapters:[]});
  if(type==='chapter') D.subjects.find(x=>x.id===id).chapters.push({id:uid(),name:v,at:t,opens:0,topics:[]});
  if(type==='topic') D.subjects.forEach(s=>s.chapters.forEach(c=>{if(c.id===id)c.topics.push({id:uid(),title:v,notes:(ins[1].value||'').trim(),at:t,opens:0,subs:[]})}));
  if(type==='sub') D.subjects.forEach(s=>s.chapters.forEach(c=>c.topics.forEach(t=>{if(t.id===id)t.subs.push({id:uid(),title:v,notes:(ins[1].value||'').trim(),at:t0(),opens:0})})));
  save();render();
  const n=document.querySelector(`form[data-f="${type}"]${id?`[data-id="${id}"]`:''} input`); if(n)n.focus();
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
// Auto-refresh so times, order and due counts stay current without a reload (skipped while typing or a dialog is open).
function idle(){const a=document.activeElement;return ov.style.display!=='flex'&&![...document.querySelectorAll('input[type=text]')].some(i=>i.value)&&!(a&&a.tagName==='INPUT')}
function refresh(){if(idle())render()}
setInterval(refresh,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
window.addEventListener('focus',refresh);
window.addEventListener('storage',e=>{if(e.key===K){D=load();refresh()}});
render();
</script>
